name: Backend CD

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-cd.yml'
      - '.github/actions/setup-gcp/**'

# ──────────────────────────────────────────
# インフラは infra/ の Terraform で管理。
# 初回セットアップ: cd infra && terraform init && terraform apply
# GitHub Variables / Secrets の設定値は terraform output で確認。
# ──────────────────────────────────────────

jobs:
  # ──────────────────────────────────────────
  # 1. Docker build → 2. DB migrate → 3. Cloud Run deploy
  # ──────────────────────────────────────────
  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write  # Workload Identity Federation に必要

    steps:
      - uses: actions/checkout@v4

      # ── Step 1: GCP認証・gcloud・Docker設定 ──
      - uses: ./.github/actions/setup-gcp
        with:
          wif-provider: ${{ vars.WIF_PROVIDER }}
          wif-service-account: ${{ vars.WIF_SERVICE_ACCOUNT }}
          gcp-region: ${{ vars.GCP_REGION }}

      # ── Step 2: Dockerイメージ build → Artifact Registry push ──
      - name: Build and push image
        id: build
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPO }}/backend:${{ github.sha }}"
          docker build -t "$IMAGE" ./backend
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # ── Step 3: DBマイグレーション (Atlas) ──
      - uses: ariga/setup-atlas@v0

      - name: Run database migrations
        run: |
          atlas migrate apply \
            --dir "file://backend/internal/infrastructure/rdb/migrations" \
            --url "${{ secrets.DATABASE_URL }}" \
            --revisions-schema public \
            --allow-dirty

      # ── Step 4: Cloud Run デプロイ ──
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ vars.CLOUD_RUN_SERVICE }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ steps.build.outputs.image }}
          flags: --allow-unauthenticated
          env_vars: |
            APP_ENV=production
            LOG_LEVEL=info
            DB_PORT=5432
            DB_SSL_MODE=require
          secrets: |
            DB_PASSWORD=DB_PASSWORD:latest
