name: CD

on:
  push:
    branches: [main]

# ──────────────────────────────────────────
# インフラは infra/ ディレクトリの Terraform で管理しています。
# 初回セットアップ: cd infra && cp terraform.tfvars.example terraform.tfvars && terraform init && terraform apply
# GitHub Variables / Secrets に設定する値は terraform output で確認できます。
# ──────────────────────────────────────────

jobs:
  deploy-backend:
    name: Deploy Backend → Cloud Run
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write  # Workload Identity Federation に必要

    steps:
      - uses: actions/checkout@v4

      # ── GCP認証 (Workload Identity Federation / keyless) ──
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # ── Docker → Artifact Registry ──
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        id: build
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPO }}/backend:${{ github.sha }}"
          docker build -t "$IMAGE" ./backend
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # ── DB migration (Atlas) ──
      - uses: ariga/setup-atlas@v0
        with:
          cloud-token: ""  # セルフホスト利用のためトークン不要

      - name: Run database migrations
        run: |
          atlas migrate apply \
            --dir "file://backend/internal/infrastructure/rdb/migrations" \
            --url "${{ secrets.DATABASE_URL }}"

      # ── Cloud Run デプロイ ──
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ vars.CLOUD_RUN_SERVICE }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ steps.build.outputs.image }}
          flags: --allow-unauthenticated
          env_vars: |
            APP_ENV=production
            PORT=8080
            LOG_LEVEL=info
            DB_PORT=5432
          secrets: |
            DB_HOST=DB_HOST:latest
            DB_USER=DB_USER:latest
            DB_PASSWORD=DB_PASSWORD:latest
            DB_NAME=DB_NAME:latest
