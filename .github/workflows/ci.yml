name: CI

on:
  pull_request:

jobs:
  # ──────────────────────────────────────────
  # Backend: lint
  # ──────────────────────────────────────────
  backend-lint:
    name: Backend / Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true

      - uses: golangci/golangci-lint-action@v6
        with:
          version: v2.11.4
          working-directory: backend

  # ──────────────────────────────────────────
  # Backend: test
  # ──────────────────────────────────────────
  backend-test:
    name: Backend / Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true

      - name: Run tests
        run: go test -v ./...

  # ──────────────────────────────────────────
  # Frontend: build check (型エラー含む)
  # ──────────────────────────────────────────
  frontend-build:
    name: Frontend / Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
