version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres_local
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: todo-go
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: todo_api_local
    ports:
      - "8080:8080"
    environment:
      DB_DSN: "postgres://user:password@postgres:5432/todo-go?sslmode=disable"
    depends_on:
      - postgres

volumes:
  postgres_data:
