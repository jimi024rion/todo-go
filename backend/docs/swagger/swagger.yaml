basePath: /
definitions:
  ApiKeyCreateErrorResponse:
    properties:
      resultBody:
        $ref: '#/definitions/ApiKeyItemErr'
      resultHeader:
        $ref: '#/definitions/ResultHeader'
    type: object
  ApiKeyCreateRequest:
    properties:
      name:
        example: My API Key
        maxLength: 50
        minLength: 1
        type: string
      user_id:
        example: 01234567-89ab-cdef-0123-456789abcdef
        format: uuid
        type: string
    required:
    - name
    - user_id
    type: object
  ApiKeyCreateResponse:
    properties:
      resultBody:
        $ref: '#/definitions/ApiKeyItem'
      resultHeader:
        $ref: '#/definitions/ResultHeader'
    type: object
  ApiKeyItem:
    properties:
      created_at:
        type: string
      id:
        example: 01234567-89ab-cdef-0123-456789abcdef
        type: string
      key:
        example: todo_abc123...
        type: string
      name:
        example: My API Key
        type: string
      user_id:
        example: 01234567-89ab-cdef-0123-456789abcdef
        type: string
    type: object
  ApiKeyItemErr:
    properties:
      created_at:
        example: ""
        type: string
      id:
        example: ""
        type: string
      key:
        example: ""
        type: string
      name:
        example: ""
        type: string
      user_id:
        example: ""
        type: string
    type: object
  ErrorNullResponse:
    properties:
      resultBody:
        type: object
      resultHeader:
        $ref: '#/definitions/ResultHeader'
    type: object
  HealthCheckResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  ResultHeader:
    properties:
      resultCode:
        example: 0
        type: integer
    type: object
  TodoCreateBody:
    properties:
      id:
        example: 01234567-89ab-cdef-0123-456789abcdef
        type: string
    type: object
  TodoCreateRequest:
    properties:
      description:
        example: 牛乳、卵、パンを買う
        maxLength: 1000
        type: string
      title:
        example: 買い物リストを作る
        maxLength: 100
        minLength: 1
        type: string
    required:
    - title
    type: object
  TodoCreateResponse:
    properties:
      resultBody:
        $ref: '#/definitions/TodoCreateBody'
      resultHeader:
        $ref: '#/definitions/ResultHeader'
    type: object
  TodoGetResponse:
    properties:
      resultBody:
        $ref: '#/definitions/TodoItem'
      resultHeader:
        $ref: '#/definitions/ResultHeader'
    type: object
  TodoItem:
    properties:
      CreatedAt:
        type: string
      Description:
        example: 牛乳、卵、パンを買う
        type: string
      ID:
        example: 01234567-89ab-cdef-0123-456789abcdef
        type: string
      Status:
        example: pending
        type: string
      Title:
        example: 買い物リストを作る
        type: string
      UpdatedAt:
        type: string
    type: object
  TodoListResponse:
    properties:
      resultBody:
        items:
          $ref: '#/definitions/TodoItem'
        type: array
      resultHeader:
        $ref: '#/definitions/ResultHeader'
    type: object
  TodoUpdateRequest:
    properties:
      description:
        example: 牛乳、卵、パンを買う
        maxLength: 1000
        type: string
      status:
        enum:
        - pending
        - in_progress
        - completed
        example: in_progress
        type: string
      title:
        example: 買い物リストを作る
        maxLength: 100
        type: string
    type: object
  UserCreateRequest:
    properties:
      email:
        example: john@example.com
        format: email
        type: string
      name:
        example: John Doe
        maxLength: 100
        minLength: 1
        type: string
    required:
    - email
    - name
    type: object
  UserCreateResponse:
    properties:
      resultBody:
        $ref: '#/definitions/UserItem'
      resultHeader:
        $ref: '#/definitions/ResultHeader'
    type: object
  UserItem:
    properties:
      created_at:
        type: string
      email:
        example: john@example.com
        type: string
      id:
        example: 01234567-89ab-cdef-0123-456789abcdef
        type: string
      name:
        example: John Doe
        type: string
      updated_at:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Todo管理アプリケーションのREST API
  title: Todo API
  version: "1.0"
paths:
  /health:
    get:
      description: サーバーの稼働状況を確認します
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/HealthCheckResponse'
      summary: ヘルスチェック
      tags:
      - health
  /v1/api-keys:
    post:
      consumes:
      - application/json
      description: 新しいAPIキーを発行します（認証不要）
      parameters:
      - description: APIキー作成リクエスト
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/ApiKeyCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/ApiKeyCreateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorNullResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ApiKeyCreateErrorResponse'
      summary: APIキー作成
      tags:
      - api-keys
  /v1/api-keys/{id}:
    delete:
      description: 指定されたIDのAPIキーを削除します
      parameters:
      - description: APIキーID
        example: '"01234567-89ab-cdef-0123-456789abcdef"'
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorNullResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorNullResponse'
      security:
      - ApiKeyAuth: []
      summary: APIキー削除
      tags:
      - api-keys
  /v1/todos:
    get:
      description: すべてのタスクを一覧で取得します
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/TodoListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorNullResponse'
      security:
      - ApiKeyAuth: []
      summary: タスク一覧取得
      tags:
      - todos
    post:
      consumes:
      - application/json
      description: 新しいタスクを作成します
      parameters:
      - description: タスク作成リクエスト
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/TodoCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/TodoCreateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorNullResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorNullResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorNullResponse'
      security:
      - ApiKeyAuth: []
      summary: タスク作成
      tags:
      - todos
  /v1/todos/{id}:
    delete:
      description: 指定されたIDのタスクを削除します
      parameters:
      - description: タスクID
        example: '"01234567-89ab-cdef-0123-456789abcdef"'
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorNullResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorNullResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorNullResponse'
      security:
      - ApiKeyAuth: []
      summary: タスク削除
      tags:
      - todos
    get:
      description: 指定されたIDのタスクを取得します
      parameters:
      - description: タスクID
        example: '"01234567-89ab-cdef-0123-456789abcdef"'
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/TodoGetResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorNullResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorNullResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorNullResponse'
      security:
      - ApiKeyAuth: []
      summary: タスク詳細取得
      tags:
      - todos
    put:
      consumes:
      - application/json
      description: 指定されたIDのタスクを更新します
      parameters:
      - description: タスクID
        example: '"01234567-89ab-cdef-0123-456789abcdef"'
        in: path
        name: id
        required: true
        type: string
      - description: タスク更新リクエスト
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/TodoUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/TodoGetResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorNullResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorNullResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorNullResponse'
      security:
      - ApiKeyAuth: []
      summary: タスク更新
      tags:
      - todos
  /v1/users:
    post:
      consumes:
      - application/json
      description: 新しいユーザーを作成します
      parameters:
      - description: ユーザー作成リクエスト
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/UserCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/UserCreateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorNullResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorNullResponse'
      security:
      - ApiKeyAuth: []
      summary: ユーザー作成
      tags:
      - users
securityDefinitions:
  ApiKeyAuth:
    description: X-API-Keyヘッダーにトークンを設定してください
    in: header
    name: X-API-Key
    type: apiKey
swagger: "2.0"
