runners:
  req: http://localhost:8080
vars:
  test_user_id: "00000000-0000-0000-0000-000000000001"
  test_api_key: "test-api-key-for-scenario"
steps:
  setup:
    include:
      path: ../shared/bootstrap.yaml
  create_apikey:
    req:
      /v1/api-keys:
        post:
          body:
            application/json:
              user_id: "{{ vars.test_user_id }}"
              name: "Key to delete"
    test: current.res.status == 201
    bind:
      new_key_id: current.res.body.resultBody.id
  delete_apikey:
    req:
      /v1/api-keys/{{ new_key_id }}:
        delete:
          headers:
            X-API-Key: "{{ vars.test_api_key }}"
    test: current.res.status == 204
