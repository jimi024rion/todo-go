runners:
  req: http://localhost:8080
vars:
  test_api_key: "test-api-key-for-scenario"
steps:
  setup:
    include:
      path: ../shared/bootstrap.yaml
  create_todo:
    req:
      /v1/todos:
        post:
          headers:
            X-API-Key: "{{ vars.test_api_key }}"
          body:
            application/json:
              title: "テストタスク"
              description: "これはテスト用のタスクです"
    test: current.res.status == 201 && current.res.body.resultHeader.resultCode == 0 && current.res.body.resultBody.id != ""
