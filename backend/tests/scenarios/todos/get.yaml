runners:
  req: http://localhost:8080
vars:
  test_api_key: "test-api-key-for-scenario"
steps:
  setup:
    include:
      path: ../shared/bootstrap.yaml
  create_todo:
    req:
      /v1/todos:
        post:
          headers:
            X-API-Key: "{{ vars.test_api_key }}"
          body:
            application/json:
              title: "詳細取得テスト"
              description: "詳細取得用"
    test: current.res.status == 201
    bind:
      todo_id: current.res.body.resultBody.id
  get_todo:
    req:
      /v1/todos/{{ todo_id }}:
        get:
          headers:
            X-API-Key: "{{ vars.test_api_key }}"
    test: current.res.status == 200 && current.res.body.resultHeader.resultCode == 0 && current.res.body.resultBody.ID == todo_id && current.res.body.resultBody.Title == "詳細取得テスト"
