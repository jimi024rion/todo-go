runners:
  req: http://localhost:8080
vars:
  test_api_key: "test-api-key-for-scenario"
steps:
  setup:
    include:
      path: ../shared/bootstrap.yaml
  create_todo:
    req:
      /v1/todos:
        post:
          headers:
            X-API-Key: "{{ vars.test_api_key }}"
          body:
            application/json:
              title: "更新前タイトル"
              description: "更新テスト用"
    test: current.res.status == 201
    bind:
      todo_id: current.res.body.resultBody.id
  update_todo:
    req:
      /v1/todos/{{ todo_id }}:
        put:
          headers:
            X-API-Key: "{{ vars.test_api_key }}"
          body:
            application/json:
              title: "更新後タイトル"
              description: "更新後の説明"
              status: "in_progress"
    test: current.res.status == 200 && current.res.body.resultHeader.resultCode == 0 && current.res.body.resultBody.ID == todo_id && current.res.body.resultBody.Title == "更新後タイトル" && current.res.body.resultBody.Status == "in_progress"
