runners:
  req: http://localhost:8080
vars:
  test_api_key: "test-api-key-for-scenario"
steps:
  setup:
    include:
      path: ../shared/bootstrap.yaml
  create_user:
    req:
      /v1/users:
        post:
          headers:
            X-API-Key: "{{ vars.test_api_key }}"
          body:
            application/json:
              name: "New User"
              email: "newuser@example.com"
    test: current.res.status == 201 && current.res.body.resultHeader.resultCode == 0 && current.res.body.resultBody.id != "" && current.res.body.resultBody.name == "New User" && current.res.body.resultBody.email == "newuser@example.com"
