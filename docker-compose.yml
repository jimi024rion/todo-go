version: '3.8'

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/18/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Firebase Emulator Suite
  firebase:
    container_name: local-firebase
    build:
      context: .
      dockerfile: local/firebase/Dockerfile
    ports:
      - "4000:4000" # Emulator UI
      - "9099:9099" # Authentication
      - "8085:8085" # Pub/Sub
      - "9199:9199" # Cloud Storage
    volumes:
      # ホスト側のfirebaseディレクトリをマウント（設定変更などを即反映させるため）
      - ./local/firebase:/app
    working_dir: /app
    # デモプロジェクトIDを指定して起動（ログイン不要で動作します）
    command: firebase emulators:start --project=demo-local --import=./data --export-on-exit
    tty: true

  ses-local:
    container_name: ses-local
    # image: node:22
    # working_dir: /app
    # command: ["npx", "-y", "aws-ses-v2-local", "--host", "0.0.0.0"]
    build:
      context: .
      dockerfile: local/ses/Dockerfile
    ports:
      - "8005:8005"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8005/health-check" ]

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317"   # OTLP gRPC
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped

volumes:
  postgres_data:
